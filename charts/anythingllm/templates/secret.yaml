apiVersion: v1
stringData:
  openai_api_key: {{ .Values.anythingllm.llm.apiKey }}
{{- if .Values.anythingllm.embedder.apiKey }}
  embedder_api_key: {{ .Values.anythingllm.embedder.apiKey }}
{{- end }}
{{- if .Values.chroma.apiKey }}
  chroma_api_key: {{ .Values.chroma.apiKey }}
{{- end }}
{{- if .Values.qdrant.apiKey }}
  qdrant_api_key: {{ .Values.qdrant.apiKey }}
{{- end }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-anythingllm-secrets
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
type: Opaque
immutable: true