apiVersion: v1
stringData:
  openaiApiKey: {{ .Values.anythingllm.llm.apiKey }}
{{- if .Values.anythingllm.embedder.apiKey }}
  embedderApiKey: {{ .Values.anythingllm.embedder.apiKey }}
{{- end }}
{{- if .Values.chroma.apiKey }}
  chromaApiKey: {{ .Values.chroma.apiKey }}
{{- end }}
{{- if .Values.qdrant.apiKey }}
  qdrantApiKey: {{ .Values.qdrant.apiKey }}
{{- end }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-anythingllm-secrets
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
type: Opaque
immutable: true