apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-audiocpp
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: audiocpp
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: audiocpp
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: audiocpp
        role: leader
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId | default .Release.Name }}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}
      {{- end }}
      containers:
      - name: audiocpp
      {{- if eq .Values.resources.backend "cuda" }}
        image: ghcr.io/0xshug0/audio.cpp:full-cuda13
      {{- else }}
        image: ghcr.io/0xshug0/audio.cpp:full-cpu
      {{- end }}
        command:
        - sh
        - -c
        - |
          echo "Deploying server..."
        {{- if .Values.audiocpp.ui.enabled }}
          /app/entrypoint.sh server --ui --ui-management --host 0.0.0.0 --port 8080 --backend {{ .Values.resources.backend }}
        {{- else }}
          /app/entrypoint.sh server --no-ui --host 0.0.0.0 --port 8080 --backend {{ .Values.resources.backend }}
        {{- end }}
        env:
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: main-port
        resources:
          requests:
            cpu: {{ .Values.resources.cpus | quote }}
            memory: {{ .Values.resources.memory }}Gi
          limits:
            cpu: {{ .Values.resources.cpus | quote }}
            memory: {{ .Values.resources.memory }}Gi
        volumeMounts:
        - name: data
          mountPath: /app/models
      volumes:
    {{- if .Values.pvd.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-audiocpp-pvc
    {{- else }}
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.resources.workingMemory }}Gi
    {{- end }}
      restartPolicy: Always
---
{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-audiocpp-pvc
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: audiocpp
spec:
  accessModes:
  {{- range .Values.pvc.accessModes }}
    - {{ . }}
  {{- end }}
  storageClassName: {{ .Values.pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}Gi
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-audiocpp-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId }}
spec:
  selector:
    component: audiocpp
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
  ports:
    - name: main
      port: 8080
      targetPort: 8080
      protocol: TCP
  {{- if .Values.ingress.enabled }}
  type: ClusterIP
  {{- else }}
  type: NodePort
  {{- end }}
