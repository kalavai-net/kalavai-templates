{{- if .Values.redis.enabled }}
apiVersion: v1
stringData:
  redis_password: {{ .Values.redis.password}}
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
    component: redis
type: Opaque
immutable: true
---
# Redis for fault tolerance https://www.plural.sh/blog/redis-cluster-on-kubernetes/
# migrate to valkey: https://github.com/valkey-io/valkey-helm/tree/main/valkey
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-service
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
    component: redis
spec:
  {{- if .Values.ingress.enabled }}
  type: ClusterIP
  {{- else }}
  type: NodePort
  {{- end }}
  ports:
  - name: redis
    port: 6379
  selector:
    kalavai.job.name: {{ .Values.system.jobId }}
    component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId }}
      component: redis
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId }}
        component: redis
    spec:
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      containers:
      - name: redis
        image: redis:{{ .Values.redis.version }}
        command:
        - "sh"
        - "-c"
        - |
          redis-server --requirepass $REDIS_PASSWORD
        ports:
        - containerPort: 6379
        env:
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis-secret
              key: redis_password
        resources:
          requests:
            cpu: {{ .Values.resources.cpus }}
            memory: {{ .Values.resources.memory }}Gi
          limits:
            cpu: {{ .Values.resources.cpus }}
            memory: {{ .Values.resources.memory }}Gi
{{- end }}