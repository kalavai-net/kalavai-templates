apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hermes-config
data:
  config.yaml: |
    webapp:
      enabled: {{ .Values.hermes.dashboard }}
      host: 0.0.0.0
      port: 9120

    model:
      provider: {{ .Values.hermes.provider }}
    {{- if eq .Values.hermes.provider "custom" }}
      default: {{ .Values.hermes.custom.model }}
      base_url: {{ .Values.hermes.custom.base_url }}
    custom_providers:
      - name: kalavai
        base_url: {{ .Values.hermes.custom.base_url }}
        model: {{ .Values.hermes.custom.model }}
        models:
          {{ .Values.hermes.custom.model }}: {}
    {{- else if eq .Values.hermes.provider "openrouter" }}
      default: {{ .Values.hermes.openrouter.model }}
    {{- end }}
