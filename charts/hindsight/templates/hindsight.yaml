apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hindsight-repo-{{ .Release.Name }}
  labels:
    kalavai.job.name: {{ .Values.system.jobId}}
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/vectorize-io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name}}-hindsight
  labels:
    kalavai.job.name: {{ .Values.system.jobId}}
spec:
  interval: 10m
  chart:
    spec:
      chart: hindsight
      version: {{ .Values.hindsight.version | quote }}
      sourceRef:
        kind: HelmRepository
        name: hindsight-repo-{{ .Release.Name }}
        namespace: {{ .Release.Namespace }}
  values:
    # more options https://github.com/vectorize-io/hindsight/blob/main/helm/hindsight/values.yaml
    priorityClassName: {{ .Values.system.priorityClassName }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: kalavai.job.name
                operator: In
                values:
                - {{ .Values.system.jobId | default .Release.Name }}
            topologyKey: "kubernetes.io/hostname"
    {{- if .Values.system.nodeSelectors }}
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
        {{- if eq .Values.system.nodeSelectorsOps "OR" }}
          {{ range $k, $v := .Values.system.nodeSelectors }}
          - matchExpressions:
            - key: {{$k}}
              operator: In
              values:
              {{- range $v }}
              - "{{ . }}"
              {{- end }}
          {{ end }}
        {{- else }}
          - matchExpressions:
          {{ range $k, $v := .Values.system.nodeSelectors }}
            {{ range $v }}
            - key: {{ $k }}
              operator: In
              values:
              - "{{ . }}"
            {{ end }}
          {{ end }}
        {{- end }}
    {{- end }}
    api:
      env:
      {{- if .Values.hindsight.env }}
        {{- toYaml .Values.hindsight.env | nindent 8 }}
      {{- end }}
        HINDSIGHT_API_LLM_MAX_CONCURRENT: {{ .Values.hindsight.llm.maxConcurrent }}
        HINDSIGHT_API_LLM_BASE_URL: {{ .Values.hindsight.llm.baseUrl | quote }}
        HINDSIGHT_API_LLM_PROVIDER: {{ .Values.hindsight.llm.provider | quote }}
        HINDSIGHT_API_LLM_MODEL: {{ .Values.hindsight.llm.model | quote }}
      {{- if and .Values.hindsight.embedding.baseUrl .Values.hindsight.embedding.model }}
        HINDSIGHT_API_EMBEDDINGS_PROVIDER: {{ .Values.hindsight.embedding.provider | quote }}
        HINDSIGHT_API_EMBEDDINGS_{{ .Values.hindsight.embedding.provider | upper }}_MODEL: {{ .Values.hindsight.embedding.model | quote }}
        HINDSIGHT_API_EMBEDDINGS_{{ .Values.hindsight.embedding.provider | upper }}_BASE_URL: {{ .Values.hindsight.embedding.baseUrl | quote }}
      {{- end }}
      secrets:
      {{- if .Values.hindsight.secrets }}  
        {{- toYaml .Values.hindsight.secrets | nindent 8 }}
      {{- end }}
        HINDSIGHT_API_LLM_API_KEY: {{ .Values.hindsight.llm.apiKey | quote }}
        HINDSIGHT_API_EMBEDDINGS_{{ .Values.hindsight.embedding.provider | upper }}_API_KEY: {{ .Values.hindsight.embedding.apiKey | quote }}
      {{- if not .Values.postgresql.enabled }}
        HINDSIGHT_API_DATABASE_URL: {{ .Values.postgresql.externalConnectionString | quote }}
      {{- end }}
      service:
        type: {{ if .Values.ingress.enabled }}ClusterIP{{ else }}NodePort{{ end }}
    worker:
      enabled: {{ .Values.hindsight.worker.enabled }}
      replicaCount: {{ .Values.hindsight.worker.replicaCount }}
    controlPlane:
      enabled: true
      replicaCount: 1
      service:
        type: {{ if .Values.ingress.enabled }}ClusterIP{{ else }}NodePort{{ end }}
  {{- if .Values.postgresql.enabled }}  
    postgresql:
      enabled: {{ .Values.postgresql.enabled }}
      auth:
        username: {{ .Values.postgresql.username }}
        password: {{ .Values.postgresql.password }}
        database: {{ .Values.postgresql.database }}
  {{- end }}
    autoscaling:
      enabled: {{ .Values.hindsight.autoscaling.enabled }}
      minReplicas: {{ .Values.hindsight.autoscaling.minReplicas }}
      maxReplicas: {{ .Values.hindsight.autoscaling.maxReplicas }}
      targetCPUUtilizationPercentage: {{ .Values.hindsight.autoscaling.targetCPUUtilizationPercentage }}
      targetMemoryUtilizationPercentage: {{ .Values.hindsight.autoscaling.targetMemoryUtilizationPercentage }}