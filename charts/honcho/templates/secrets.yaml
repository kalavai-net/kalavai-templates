apiVersion: v1
stringData:
  api_key: {{ .Values.honcho.apiKey | quote }}
  deriver_api_key: {{ .Values.honcho.deriver.apiKey }}
  embedder_api_key: {{ .Values.honcho.embedder.apiKey }}
  dreamer_api_key: {{ .Values.honcho.dreamer.apiKey }}
  default_api_key: {{ .Values.honcho.default.apiKey }}
  summariser_api_key: {{ .Values.honcho.summariser.apiKey }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-honcho-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
type: Opaque
immutable: true
