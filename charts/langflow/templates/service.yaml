apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langflow-frontend-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
spec:
  selector:
    app: langflow-service
    langflow-scope: frontend
    release: {{ .Release.Name }}-langflow
  ports:
    - name: editor
      port: 8080
      targetPort: 8080
      protocol: TCP
  {{- if .Values.ingress.enabled }}
  type: ClusterIP
  {{- else }}
  type: NodePort
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langflow-backend-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
spec:
  selector:
    app: langflow-service
    langflow-scope: backend
    release: {{ .Release.Name }}-langflow
  ports:
    - name: api
      port: 7860
      targetPort: 7860
      protocol: TCP
  {{- if .Values.ingress.enabled }}
  type: ClusterIP
  {{- else }}
  type: NodePort
  {{- end }}