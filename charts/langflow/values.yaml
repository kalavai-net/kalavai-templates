langflow:
  version: 1.12.6-1
  ssrfProtectionEnabled: false
  ssfrAllowedHoss: 0.0.0.0/0
  backend:
    replicaCount: 1
    numWorkers: 1
    superuserPassword: "password"
  frontend:
    version: latest
    replicaCount: 1
  
postgresql:
  enabled: false
  username: "langflow"
  password: "langflow-postgres"
  database: "langflow-db"

ingress:
  enabled: false
  subdomain: spaces.kalavai.net

# pvc:
#   enabled: false

system:
  priorityClassName: user-spot-priority
  nodeSelectors: null
  nodeSelectorsOps: OR
  nodeAffinityPreferenceKey: null
  jobId: null
  envFromSecrets: {}

resources:
  replicas: 1
  workerGpuMemory: null
  workers: 1
  backend: cuda
  workingMemory: 16
  memory: 2
  cpus: 1
  gpus: 1
