apiVersion: v1
stringData:
  redis_auth: {{ .Values.redis.externalPassword }}
  postgres_external_url: {{ .Values.postgres.externalHost }}
  langfuse_init_project_public_key: {{ .Values.langfuse.default.initProjectPublicKey }}
  langfuse_init_project_secret_key: {{ .Values.langfuse.default.initProjectSecretKey }}
  langfuse_init_user_password: {{ .Values.langfuse.default.initUserPassword }}
  worker_salt: {{ .Values.langfuse.salt }}
  worker_encryption_key: {{ .Values.langfuse.encryptionKey }}
  nextauth_secret: {{ .Values.langfuse.secret }}
  minio_secret: {{ .Values.minio.secret }}
  clickhouse_user: {{ .Values.clickhouse.externalUser }}
  clickhouse_password: {{ .Values.clickhouse.externalPassword }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-langfuse-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
type: Opaque
immutable: true
