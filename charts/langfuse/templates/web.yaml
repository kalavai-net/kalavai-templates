# Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-langfuse-web
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: web
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: web
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId | default .Release.Name}}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}`
      {{- end }}
      containers:
      - name: service
        image: "docker.langfuse.com/langfuse/langfuse:{{ .Values.langfuse.version }}"
        ports:
        - containerPort: 3000
        env: #https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        - name: SALT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: worker_salt
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: worker_encryption_key
        - name: NEXTAUTH_URL
          value: http://localhost:3000
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: nextauth_secret
        - name: DATABASE_URL
        {{- if .Values.postgres.enabled }}
          value: postgresql://postgres:postgres@{{ .Release.Name }}-langfuse-postgres-svc:5432/postgres
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: postgres_external_url
        {{- end }}
        - name: LANGFUSE_USE_AZURE_BLOB
          value: "false"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: http://localhost:9090
        - name: LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT
          value: http://{{ .Release.Name }}-minio-svc:9000
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          value: "minio"
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          value: minio
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
          value: "true"
        - name: LANGFUSE_S3_BATCH_EXPORT_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_BATCH_EXPORT_PREFIX
          value: "exports/"
        - name: LANGFUSE_S3_BATCH_EXPORT_REGION
          value: "auto"
        - name: LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT
          value: "http://{{ .Release.Name }}-langfuse-minio-svc:9090"
        - name: LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID
          value: "minio"
        - name: LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_INIT_ORG_ID
          value: "default_org_id"
        - name: LANGFUSE_INIT_ORG_NAME
          value: {{ .Values.langfuse.default.initOrgName }}
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "default_project_id"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: {{ .Values.langfuse.default.initProjectName }}
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: langfuse_init_project_public_key
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: langfuse_init_project_secret_key
        - name: LANGFUSE_INIT_USER_EMAIL
          value: {{ .Values.langfuse.default.initUserEmail }}
        - name: LANGFUSE_INIT_USER_NAME
          value: {{ .Values.langfuse.default.InitUserName }}
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: langfuse_init_user_password
        - name: LANGFUSE_MCP_ALLOWED_HOSTS
          value: "*"
        - name: LANGFUSE_AI_GATEWAY_DEPLOYED
          value: {{ .Values.gateway.enabled | quote }}
        - name: LANGFUSE_AI_GATEWAY_ENABLED
          value: {{ .Values.gateway.enabled | quote }}
      {{- if .Values.gateway.enabled }}
          # In-app agent settings.
        - name: LANGFUSE_AI_GATEWAY_SERVICE_KEY
          value: "" # same key as langfuse-ai-gateway
        - name: LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY
          value: ""
        - name: LANGFUSE_AI_GATEWAY_PUBLIC_URL
          value: http://{{ .Release.Name }}-langfuse-gateway-svc:3031
          # LANGFUSE_AI_GATEWAY_ORGANIZATION_ID_ALLOWLIST: ${LANGFUSE_AI_GATEWAY_ORGANIZATION_ID_ALLOWLIST:-}
      {{- end }}
      {{- if .Values.clickhouse.enabled }}
        - name: CLICKHOUSE_DB
          value: default
        - name: CLICKHOUSE_USER
          value: clickhouse
        - name: CLICKHOUSE_PASSWORD
          value: clickhouse
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        - name: CLICKHOUSE_MIGRATION_URL
          value: clickhouse://{{ .Release.Name }}-langfuse-clickhouse-svc:9000
        - name: CLICKHOUSE_URL
          value: http://{{ .Release.Name }}-langfuse-clickhouse-svc:8123
      {{- else }}
        - name: CLICKHOUSE_DB
          value: {{ .Values.clickhouse.externalDB }}
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: clickhouse_user
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: clickhouse_password
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        - name: CLICKHOUSE_MIGRATION_URL
          value: {{ .Values.clickhouse.externalMigrationUrl }}
        - name: CLICKHOUSE_URL
          value: {{ .Values.clickhouse.externalUrl }}
      {{- end }}
      resources:
        requests:
          cpu: 0.5
          memory: 1.5Gi
        limits:
          cpu: 0.5
          memory: 1.5Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langfuse-web-svc
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
    component: web
spec:
{{- if .Values.ingress.enabled }}
  type: ClusterIP
{{- else }}
  type: NodePort
{{- end }}
  ports:
  - name: web
    port: 3000
  selector:
    kalavai.job.name: {{ .Values.system.jobId }}
    component: web