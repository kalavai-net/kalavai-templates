# Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-langfuse-worker
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: worker
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: worker
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId | default .Release.Name}}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}`
      {{- end }}
      containers:
      - name: service
        image: "docker.langfuse.com/langfuse/langfuse-worker:{{ .Values.langfuse.version }}"
        env: #https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        - name: NEXTAUTH_URL
          value: http://localhost:3000
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: nextauth_secret
        - name: DATABASE_URL
        {{- if .Values.postgres.enabled }}
          value: postgresql://postgres:postgres@{{ .Release.Name }}-langfuse-postgres-svc:5432/postgres
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: postgres_external_url
        {{- end }}
        - name: SALT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: worker_salt
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: worker_encryption_key
        - name: TELEMETRY_ENABLED
          value: "true"
        - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
          value: "true"
        {{- if .Values.clickhouse.enabled }}
        - name: CLICKHOUSE_USER
          value: clickhouse
        - name: CLICKHOUSE_PASSWORD
          value: clickhouse
        - name: CLICKHOUSE_DB
          value: default
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        - name: CLICKHOUSE_MIGRATION_URL
          value: clickhouse://{{ .Release.Name }}-clickhouse-svc:9000
        - name: CLICKHOUSE_URL
          value: http://{{ .Release.Name }}-clickhouse-svc:8123
        {{- else }}
        - name: CLICKHOUSE_DB
          value: {{ .Values.clickhouse.externalDB }}
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: clickhouse_user
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: clickhouse_password
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        - name: CLICKHOUSE_MIGRATION_URL
          value: {{ .Values.clickhouse.externalMigrationUrl }}
        - name: CLICKHOUSE_URL
          value: {{ .Values.clickhouse.externalUrl }}
        {{- end }}
        - name: LANGFUSE_USE_AZURE_BLOB
          value: "false"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: http://localhost:9090
        - name: LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT
          value: http://{{ .Release.Name }}-minio-svc:9000
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          value: "minio"
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          value: minio
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
          value: "true"
        - name: LANGFUSE_S3_BATCH_EXPORT_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_BATCH_EXPORT_PREFIX
          value: "exports/"
        - name: LANGFUSE_S3_BATCH_EXPORT_REGION
          value: "auto"
        - name: LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT
          value: "http://{{ .Release.Name }}-langfuse-minio-svc:9090"
        - name: LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID
          value: "minio"
        - name: LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: minio_secret
        - name: LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE
          value: "true"
        {{- if .Values.redis.enabled }}
        - name: REDIS_HOST
          value: redis://{{ .Release.Name }}-langfuse-redis-svc
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_AUTH
          value: redis
        {{- else }}
        - name: REDIS_HOST
          value: {{ .Values.redis.externalHost }}
        - name: REDIS_PORT
          value: {{ .Values.redis.externalPort }}
        - name: REDIS_AUTH
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-langfuse-secret
              key: redis_auth
        {{- end }}
        - name: REDIS_TLS_ENABLED
          value: "false"
        - name: LANGFUSE_OBSERVATION_FIELD_OVERFLOW_ENABLED
          value: "false"
        - name: LANGFUSE_OBSERVATION_FIELD_SIZE_LIMIT_BYTES
          value: "2097152"
        # LANGFUSE_IN_APP_AGENT_ENABLED: ${LANGFUSE_IN_APP_AGENT_ENABLED:-}
        # LANGFUSE_AI_PROVIDER: ${LANGFUSE_AI_PROVIDER:-}
        # LANGFUSE_AI_MODEL: ${LANGFUSE_AI_MODEL:-}
        # LANGFUSE_AI_SMALL_MODEL: ${LANGFUSE_AI_SMALL_MODEL:-}
        # LANGFUSE_AI_API_KEY: ${LANGFUSE_AI_API_KEY:-}
        # LANGFUSE_AI_BASE_URL: ${LANGFUSE_AI_BASE_URL:-}
        # LANGFUSE_AI_USE_RESPONSES_API: ${LANGFUSE_AI_USE_RESPONSES_API:-}
      resources:
        requests:
          cpu: 0.25
          memory: 1Gi
        limits:
          cpu: 0.25
          memory: 1Gi
      restartPolicy: Always
    