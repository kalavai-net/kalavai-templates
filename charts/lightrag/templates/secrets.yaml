apiVersion: v1
stringData:
  embedding_api_key: {{ .Values.lightrag.embedding.apiKey | quote }}
  llm_api_key: {{ .Values.lightrag.llm.apiKey | quote }}
  rerank_api_key: {{ .Values.lightrag.rerank.apiKey | quote }}
  qdrant_api_key: {{ .Values.qdrant.apiKey | quote }}
  qdrant_readonly_api_key: {{ .Values.qdrant.readOnlyApiKey | quote }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-lightrag-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId }}
type: Opaque
immutable: true
