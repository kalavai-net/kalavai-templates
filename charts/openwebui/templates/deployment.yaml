# Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openwebui
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: openwebui
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: openwebui
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId }}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}
      {{- end }}
      containers:
      - name: service
        image: "ghcr.io/open-webui/open-webui:{{ .Values.openwebui.version }}"
        ports:
        - containerPort: 8080
          name: ui-port
        env:
      {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
      {{- end }}
        - name: OPENAI_API_BASE_URL
          value: {{ .Values.openwebui.openaiBaseUrl }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-openwebui-secret
              key: openaiApiKey
        - name: ENABLE_OLLAMA_API
          value: "False"
        - name: WEBUI_AUTH
          value: "{{ .Values.openwebui.webuiAuth }}" #"admin"
        - name: ENABLE_LOGIN_FORM
          value: "True"
        - name: ENABLE_SIGNUP
          value: "True"
        - name: DEFAULT_USER_ROLE
          value: "{{ .Values.openwebui.defaultUserRole }}" #"admin"
        - name: OFFLINE_MODE
          value: "True"
        - name: DATA_DIR
          value: "./data"
        - name: ENABLE_MESSAGE_RATING
          value: "False"
        - name: ENABLE_COMMUNITY_SHARING
          value: "False"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "True"
        resources:
          requests:
            cpu: {{ .Values.resources.cpus }}
            memory: {{ .Values.resources.memory }}Gi
          limits:
            cpu: {{ .Values.resources.cpus }}
            memory: {{ .Values.resources.memory }}Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openwebui-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
spec:
  selector:
    component: openwebui
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
  ports:
    - name: main
      port: 8080
      targetPort: 8080
      protocol: TCP
  {{- if .Values.ingress.enabled }}
  type: ClusterIP
  {{- else }}
  type: NodePort
  {{- end }}
