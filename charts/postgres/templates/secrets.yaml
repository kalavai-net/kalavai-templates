apiVersion: v1
stringData:
  username: {{ .Values.postgres.owner }}
  password: {{ .Values.postgres.password | quote }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
type: Opaque
immutable: true
---
{{- if .Values.postgres.enableSuperuserAccess }}
apiVersion: v1
stringData:
  username: postgres
  password: {{ .Values.postgres.superuserPassword | quote }}
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-super-secret
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
type: Opaque
immutable: true
{{- end }}