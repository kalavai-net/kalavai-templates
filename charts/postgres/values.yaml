postgres:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  instances: 1
  owner: user
  database: db
  password: mypassword
  enableSuperuserAccess: false
  superuserPassword: admin-password
  storage:
    size: 1
    storageClass: longhorn

ingress:
  enabled: false
  subdomain: spaces.kalavai.net

system:
  priorityClassName: user-spot-priority
  nodeSelectors: null
  nodeSelectorsOps: OR
  nodeAffinityPreferenceKey: null
  jobId: null
  envFromSecrets: {}

resources:
  replicas: 1
  workerGpuMemory: null
  workers: 1
  backend: cuda
  workingMemory: 16
  memory: 2
  cpus: 1
  gpus: 1
