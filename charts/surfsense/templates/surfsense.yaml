# Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-surfsense-server
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: surfsense
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: surfsense
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: surfsense
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId | default .Release.Name}}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}`
      {{- end }}
      containers:
      - name: service
        image: "ghcr.io/modsetter/surfsense:{{ .Values.surfsense.version }}"
        command:
        # - sh
        # - -c
        # - |
        #   # set pg schema to match embedding dimensions
        #   /app/.venv/bin/python scripts/configure_embeddings.py --yes
        #   sh docker/entrypoint.sh
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        env:
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        - name: SURFSENSE_BIND
          value: 0.0.0.0
        - name: SURFSENSE_LOCAL_PUBLIC_PORT
          value: "4929"
        - name: SURFSENSE_HTTPS_PORT
          value: "4943"
      {{- if .Values.surfsense.password }}
        - name: SURFSENSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-surfsense-secret
              key: password
      {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: {{ .Values.resources.cpus }}
          memory: {{ .Values.resources.memory }}Gi
        limits:
          cpu: {{ .Values.resources.cpus }}
          memory: {{ .Values.resources.memory }}Gi
      volumes:
    {{- if .Values.pvc.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-surfsense-pvc
    {{- else }}
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.resources.workingMemory }}Gi
    {{- end }}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-surfsense-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
spec:
  selector:
    component: surfsense
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
{{- if .Values.ingress.enabled }}
  type: ClusterIP
{{- else }}
  type: NodePort
{{- end }}
---
{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-surfsense-pvc
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: surfsense
spec:
  accessModes:
  {{- range .Values.pvc.accessModes }}
    - {{ . }}
  {{- end }}
  storageClassName: {{ .Values.pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}Gi
{{- end }}