# Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-unsloth
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: unsloth
spec:
  replicas: 1
  selector:
    matchLabels:
      kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
      component: unsloth
  template:
    metadata:
      labels:
        kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
        component: unsloth
    spec:
      terminationGracePeriodSeconds: 10
      {{- if .Values.system.priorityClassName }}
      priorityClassName: {{ .Values.system.priorityClassName }}
      {{- end }}
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unreachable"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/unknown"
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 10
      - key: "node.kubernetes.io/memory-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/disk-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/pid-pressure"
        operator: Exists
        effect: NoSchedule
      - key: "node.kubernetes.io/network-unavailable"
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: kalavai.job.name
                  operator: In
                  values:
                  - {{ .Values.system.jobId | default .Release.Name}}
              topologyKey: "kubernetes.io/hostname"
      {{- if .Values.system.nodeSelectors }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
          {{- if eq .Values.system.nodeSelectorsOps "OR" }}
            {{ range $k, $v := .Values.system.nodeSelectors }}
            - matchExpressions:
              - key: {{$k}}
                operator: In
                values:
                {{- range $v }}
                - "{{ . }}"
                {{- end }}
            {{ end }}
          {{- else }}
            - matchExpressions:
            {{ range $k, $v := .Values.system.nodeSelectors }}
              {{ range $v }}
              - key: {{ $k }}
                operator: In
                values:
                - "{{ . }}"
              {{ end }}
            {{ end }}
          {{- end }}`
      {{- end }}
      containers:
      - name: service
        image: "unsloth/unsloth:{{ .Values.unsloth.version }}"
        # command:
        # - sh
        # - -c
        # - |
        #   mkdir -p "$HERMES_HOME"
        #   cat >> "$HERMES_HOME/.env" <<EOF
        #   HERMES_DASHBOARD_BASIC_AUTH_SECRET=$(openssl rand -base64 32)
        #   EOF
        ports:
        - containerPort: 8000
          name: studio
        - containerPort: 8888
          name: notebook
        env:
        {{- if .Values.system.envFromSecrets }}
        {{- range .Values.system.envFromSecrets }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: {{ . }}
        {{- end }}
        {{- end }}
        - name: JUPYTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-unsloth-secrets
              key: jupyter_password
        - name: UNSLOTH_STUDIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-unsloth-secrets
              key: studio_password
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        volumeMounts:
        - name: data
          mountPath: /workspace
      resources:
        requests:
          cpu: {{ .Values.resources.cpus}}
          memory: {{ .Values.resources.memory}}Gi
        {{ if eq .Values.resources.backend "cuda" }}
          nvidia.com/gpu: {{ .Values.resources.gpus }}
        {{ else if eq .Values.resources.backend "rocm" }}
          amd.com/gpu: {{ .Values.resources.gpus }}
        {{ end }}
        limits:
          cpu: {{ .Values.resources.cpus}}
          memory: {{ .Values.resources.memory}}Gi
        {{ if eq .Values.resources.backend "cuda" }}
          nvidia.com/gpu: {{ .Values.resources.gpus }}
          {{ if .Values.resources.workerGpuMemory }}
          nvidia.com/gpumem: {{ mul .Values.resources.workerGpuMemory 1000 }}
          {{ end }}
        {{ else if eq .Values.resources.backend "rocm" }}
          amd.com/gpu: {{ .Values.resources.gpus }}
        {{ end }}
      volumes:
    {{- if .Values.pvc.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-unsloth-pvc
    {{- else }}
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.resources.workingMemory }}Gi
    {{- end }}
      restartPolicy: Always
---
{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-unsloth-pvc
  labels:
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
    component: unsloth
spec:
  accessModes:
  {{- range .Values.pvc.accessModes }}
    - {{ . }}
  {{- end }}
  storageClassName: {{ .Values.pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}Gi
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-unsloth-svc
  labels:
    # must have this!
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
spec:
  selector:
    component: unsloth
    kalavai.job.name: {{ .Values.system.jobId | default .Release.Name }}
  ports:
    - name: studio
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: notebook
      port: 8888
      targetPort: 8888
      protocol: TCP
{{- if .Values.ingress.enabled }}
  type: ClusterIP
{{- else }}
  type: NodePort
{{- end }}
    