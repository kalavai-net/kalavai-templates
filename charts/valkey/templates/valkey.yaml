apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey-repo-{{ .Release.Name }}
  labels:
    kalavai.job.name: {{ .Values.system.jobId}}
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name}}-valkey
  labels:
    kalavai.job.name: {{ .Values.system.jobId}}
spec:
  interval: 10m
  chart:
    spec:
      chart: valkey
      #version: "4.3.2"
      sourceRef:
        kind: HelmRepository
        name: valkey-repo-{{ .Release.Name }}
        namespace: {{ .Release.Namespace }}
  values:
    # more options https://github.com/valkey-io/valkey-helm/blob/main/valkey/values.yaml
    replica:
      enabled: {{ .Values.valkey.replica.enabled }}
      replicas: {{ .Values.valkey.replica.replicas }}
      persistence:
        size: {{ .Values.valkey.replica.persistence.size }}
      # Used both for replication and by Sentinel to monitor the nodes
      replicationUser: replicator
      sentinel:
        enabled: {{ .Values.valkey.replica.sentinel.enabled }}
        replicas: {{ .Values.valkey.replica.sentinel.replicas }}
        # Use a distinct credential for the Sentinel endpoint. In production,
        # prefer auth.usersExistingSecret and set passwordKey instead.
        password: {{ .Values.valkey.auth.aclUsers.replicator.password }}
        quorum: {{ .Values.valkey.replica.sentinel.quorum }}
        # Spread the Sentinel quorum across nodes when the cluster has capacity.
        # The top level affinity and topologySpreadConstraints apply to the Valkey
        # pods only.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: sentinel
        # Keep a Sentinel majority through node drains
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
    auth:
      enabled: true
      aclUsers:
        default:
          permissions: "~* &* +@all"
          password: {{ .Values.valkey.auth.aclUsers.default.password }}
        replicator:
          # Sentinel needs all of these to monitor the nodes and to promote a
          # replica, see replica.sentinel.monitorUser in values.yaml
          permissions: >-
            on ~* &* +multi +exec +ping +info +role +subscribe +publish +slaveof
            +replicaof +config|rewrite +client|setname +client|kill +script|kill
            +psync +replconf
          password: {{ .Values.valkey.auth.aclUsers.replicator.password }}
    priorityClassName: {{ .Values.system.priorityClassName }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: kalavai.job.name
                operator: In
                values:
                - {{ .Values.system.jobId | default .Release.Name }}
            topologyKey: "kubernetes.io/hostname"
    {{- if .Values.system.nodeSelectors }}
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
        {{- if eq .Values.system.nodeSelectorsOps "OR" }}
          {{ range $k, $v := .Values.system.nodeSelectors }}
          - matchExpressions:
            - key: {{$k}}
              operator: In
              values:
              {{- range $v }}
              - "{{ . }}"
              {{- end }}
          {{ end }}
        {{- else }}
          - matchExpressions:
          {{ range $k, $v := .Values.system.nodeSelectors }}
            {{ range $v }}
            - key: {{ $k }}
              operator: In
              values:
              - "{{ . }}"
            {{ end }}
          {{ end }}
        {{- end }}
    {{- end }}
    service:
      type: {{ if .Values.ingress.enabled }}ClusterIP{{ else }}NodePort{{ end }}
    resources:
      requests:
        memory: {{ .Values.resources.memory }}Gi
        cpu: {{ .Values.resources.cpus }}
      limits:
        memory: {{ .Values.resources.memory }}Gi
        cpu: {{ .Values.resources.cpus }}
