chromadb:
  enabled: false
  version: 1.5.10.dev313
  # config via yaml at /config.yaml https://docs.trychroma.com/guides/deploy/docker#configuration

qdrant:
  enabled: false

ingress:
  enabled: false
  subdomain: spaces.kalavai.net

pvc:
  enabled: false

system:
  priorityClassName: user-spot-priority
  nodeSelectors: null
  nodeSelectorsOps: OR
  nodeAffinityPreferenceKey: null
  jobId: null
  envFromSecrets: {}

resources:
  replicas: 1
  workerGpuMemory: null
  workers: 1
  backend: cuda
  workingMemory: 16
  memory: 2
  cpus: 1
  gpus: 1
